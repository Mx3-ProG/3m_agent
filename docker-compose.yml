services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - 3m-data:/app/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      THREEM_BACKEND_URL: http://backend:8000
      THREEM_BACKEND_TOKEN: ${THREEM_API_TOKEN}
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  3m-data:

